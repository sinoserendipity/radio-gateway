services:
  radio-gateway:
    image: ghcr.io/sinoserendipity/radio-gateway:3.0.0
    build:
      context: .
    container_name: radio-gateway
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      TZ: Asia/Shanghai
      # 1 = 清单里分片强制 https（浏览器端播放需要；LMS/PlayHLS 服务端拉流保持 0 走 http 更快）
      FORCE_HTTPS: "0"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
